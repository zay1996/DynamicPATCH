[tool.poetry]
name = "DynamicPATCH"
version = "0.2.0"
description = "Python package DynamicPATCH"
authors = ["Aiyin Zhang"]
license = "MIT"
readme = "README.md"

include = [
    { path = "dynamicpatch/static" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.26,<2.0"
pandas = ">=2.2.3,<3.0"
matplotlib = ">=3.9.2,<4.0"
matplotlib-scalebar = ">=0.9,<0.10"
opencv-python = ">=4.5.3,<5.0"
scikit-image = ">=0.22,<0.23"
openpyxl = ">=3.1.5,<4.0"
xarray = ">=2025.4,<2026"
rioxarray = ">=0.19,<0.20"
dask = ">=2025.4.1,<2026"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
black = "^24.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
